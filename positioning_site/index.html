<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rozetka</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header-container">
            <div class="logo">ROZETKA</div>
            <div class="search-bar">
                <input type="text" placeholder="Я шукаю...">
                <button>Знайти</button>
            </div>
            <div class="cart-icon">🛒 Кошик</div>
        </div>
    </header>

    <main class="main-layout">
        <aside class="sidebar">
            <h3>Каталог товарів</h3>
            <ul class="category-list">
                <li>Ноутбуки та комп'ютери</li>
                <li>Смартфони, ТВ і електроніка</li>
                <li>Побутова техніка</li>
                <li>Товари для дому</li>
                <li>Спорт і захоплення</li>
            </ul>
        </aside>

        <section class="content">
            <h2>Ноутбуки та комп'ютери</h2>
            <div id="products-grid" class="products-grid"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
