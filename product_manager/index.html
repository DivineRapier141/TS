<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Менеджер товарів</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Менеджер товарів</h1>

  <form id="productForm">
    <input type="hidden" id="productId">
    <input type="text" id="name" placeholder="Назва" required>
    <input type="number" id="price" placeholder="Ціна" min="0" step="0.01" required>
    <input type="number" id="quantity" placeholder="Кількість" min="0" required>
    <button type="submit" id="saveBtn">Додати</button>
    <button type="button" id="cancelBtn" hidden>Скасувати</button>
  </form>

  <div id="productList" class="products"></div>

  <script src="javascript/app.js"></script>
</body>
</html>
